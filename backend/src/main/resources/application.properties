spring.application.name=biblioteca-chatbot

# --- Servidor ------------------------------------------------------------------------
# 8081 para no chocar con la API de la biblioteca (8080).
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
# No exponer trazas ni mensajes internos en errores no controlados.
server.error.include-stacktrace=never
server.error.include-message=never

# --- API de la biblioteca (ver BibliotecaProperties) ---------------------------------
biblioteca.base-url=${BIBLIOTECA_API_URL:http://localhost:8080/api}
biblioteca.timeout=10s
# Reglas de préstamo de la biblioteca: la API no las publica, se repiten aquí para que el
# asistente pueda explicarlas. Deben coincidir con library.loans.* del proyecto biblioteca.
biblioteca.loan-days=14
biblioteca.max-active-loans=3
biblioteca.renewal-window-days=5

# --- CORS ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4201}
